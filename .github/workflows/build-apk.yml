name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - uploaded-apk-two-changes

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Patch Capacitor Android multi-image sharing ClipData
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('node_modules/@capacitor/share/android/src/main/java/com/capacitorjs/plugins/share/SharePlugin.java')
          s = p.read_text()

          if 'intent.setClipData(clipData);' not in s:
              pattern = r'(if\s*\(fileUris\.size\(\)\s*>\s*1\)\s*\{)'
              match = re.search(pattern, s)
              if not match:
                  raise SystemExit('Could not find the multi-file sharing branch in SharePlugin.java')
              indent = '            '
              addition = (
                  '\n' + indent + '    ClipData clipData = ClipData.newRawUri("", fileUris.get(0));'
                  + '\n' + indent + '    for (int i = 1; i < fileUris.size(); i++) {'
                  + '\n' + indent + '        clipData.addItem(new ClipData.Item(fileUris.get(i)));'
                  + '\n' + indent + '    }'
                  + '\n' + indent + '    intent.setType("image/*");'
                  + '\n' + indent + '    intent.putParcelableArrayListExtra(Intent.EXTRA_STREAM, fileUris);'
                  + '\n' + indent + '    intent.setClipData(clipData);'
              )
              s = s[:match.end()] + addition + s[match.end():]
              p.write_text(s)
              print('Added Android ClipData support for multiple shared images')
          else:
              print('Android multi-image ClipData support is already present')
          PY

      - name: Bundle Capacitor plugins
        run: npx esbuild www/plugins.js --bundle --format=iife --outfile=www/plugins.bundle.js

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app logo and launcher icons
        run: |
          python3 -m pip install --user pillow
          python3 scripts/generate-icons.py

      - name: Sync app
        run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Nikah-Matrimony-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
