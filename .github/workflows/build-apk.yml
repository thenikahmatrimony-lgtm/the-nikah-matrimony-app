name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Bundle Capacitor plugins
        run: npx esbuild www/plugins.js --bundle --format=iife --outfile=www/plugins.bundle.js

      - name: Add Android platform
        run: npx cap add android

      - name: Generate app logo and launcher icons
        run: |
          python3 -m pip install --user pillow
          python3 scripts/generate-icons.py

      - name: Sync app
        run: npx cap sync android

      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: The-Nikah-Matrimony-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
