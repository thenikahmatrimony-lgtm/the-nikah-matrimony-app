<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#123b2e"><title>The Nikah Matrimony</title><link rel="icon" href="assets/tnm-logo.jpg"><link rel="apple-touch-icon" href="assets/tnm-logo.jpg"><link rel="manifest" href="manifest.json"><style>
.appBrand{display:flex;align-items:center;gap:12px}.appBrand img{width:58px;height:58px;object-fit:cover;border-radius:50%;border:2px solid #d8b56a;background:#fffaf2}.appBrand h1{font-size:20px;margin:0}.appBrand p{margin:5px 0 0;color:#d9e5df}
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f2eb;color:#17241e}header{background:#123b2e;color:#fff;padding:18px}header h1{font-size:20px;margin:0}header p{margin:5px 0 0;color:#d9e5df}main{max-width:850px;margin:auto;padding:14px}.panel{background:#fff;border:1px solid #deded6;border-radius:14px;padding:14px;margin-bottom:14px}.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:150px}label{display:block;font-size:13px;margin:8px 0 5px;font-weight:bold}input,textarea,select,button{font:inherit;width:100%;padding:10px;border-radius:9px;border:1px solid #c9cec8;background:#fff}textarea{min-height:140px;resize:vertical}button{background:#123b2e;color:white;border:0;font-weight:bold;margin-top:8px;cursor:pointer}button.secondary{background:#e4ebe6;color:#123b2e}button.danger{background:#8a2929}.profile{border:1px solid #d7ded9;border-radius:12px;padding:12px;margin:10px 0}.profile h3{margin:0 0 6px}.bioPreview{white-space:pre-wrap;overflow-wrap:anywhere;font-family:Arial,sans-serif;line-height:1.5;background:#fafaf7;padding:10px;border-radius:8px}.meta{font-size:13px;color:#53645a}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1;min-width:120px}.hidden{display:none}.photos{display:flex;gap:8px;flex-wrap:wrap}.photoWrap{position:relative;width:90px;height:90px;overflow:hidden;border-radius:8px;border:1px solid #ddd}.photoWrap img{width:100%;height:100%;object-fit:cover}.photoWrap:after{content:"THE NIKAH MATRIMONY";position:absolute;left:0;right:0;top:42%;text-align:center;font-size:6px;font-weight:bold;letter-spacing:.25px;color:rgba(255,255,255,.48);text-shadow:0 1px 1px rgba(0,0,0,.18);transform:rotate(-24deg);pointer-events:none}.pill{display:inline-block;background:#e9eee9;padding:4px 8px;border-radius:20px;font-size:12px}small{color:#66756c}
</style></head><body><header><div class="appBrand"><img src="assets/tnm-logo.jpg" alt="The Nikah Matrimony logo"><div><h1>THE NIKAH MATRIMONY</h1><p>Biodata Manager</p></div></div></header><main><div class="panel"><h2>Cloud Sync / Admin Login</h2><div class="row"><div><label>Email</label><input type="email" id="cloudEmail" placeholder="Authorized Firebase email"></div><div><label>Password</label><input type="password" id="cloudPassword" placeholder="Password"></div></div><button id="cloudLogin">Login</button><button class="secondary" id="cloudLogout">Logout</button><button id="cloudSync">Sync Profiles & Photos</button><small id="cloudStatus">Cloud sync setup pending configuration.</small></div><div class="panel"><h2>Add / Edit Biodata</h2><input type="hidden" id="editId"><label>Complete Biodata (paste text)</label><textarea id="bio" placeholder="Paste complete biodata here..."></textarea><label>Attach photos (up to 6)</label><input id="photos" type="file" accept="image/*" multiple><small>Photos will be stored with this profile (up to 6). Save browser storage carefully.</small><div class="photos" id="photoPreview"></div><div class="row"><div><label>Package</label><select id="pkg"><option value="50">₹50 One-Time</option><option value="100">₹100 – 1 Week (Daily)</option><option value="300">₹300 – 3 Months (Alternate Days)</option><option value="500">₹500 – Until Rishta Fixed (Every 3rd Day)</option></select></div><div><label>Joining date</label><input type="date" id="join"></div><div><label>Validity end (automatic)</label><input type="date" id="expiry" readonly></div></div><div class="row"><div><label>Next posting due (automatic)</label><input type="date" id="due" readonly></div><div><label>Status</label><select id="status"><option>Active</option><option>Posted</option><option>Posting Completed</option><option>Rishta Fixed</option><option>Expired</option></select></div></div><button id="save">Save Biodata</button><button class="secondary" id="cancel" style="display:none">Cancel Edit</button></div><div class="panel"><div class="row"><div><h2 style="margin:0">Saved Profiles</h2></div><div><input id="search" placeholder="Search biodata text..."></div></div><div id="alerts" class="alertSummary" style="background:#fff8e8;border:1px solid #ead7a8;border-radius:10px;padding:10px;margin:10px 0;font-size:13px"></div><div id="list"></div></div></main><script src="plugins.bundle.js"></script><script>
const $=id=>document.getElementById(id);function esc(t){return String(t).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]||c))}let records=JSON.parse(localStorage.getItem('tnm_records')||'[]'),photoFiles=[],previewUrls=[],keptPhotos=[];function saveStore(){localStorage.setItem('tnm_records',JSON.stringify(records));render()}function effectiveStatus(r){if(r.status==='Rishta Fixed'||r.status==='Posting Completed')return r.status;if(r.expiry&&todayISO()>r.expiry)return 'Validity Expired';return r.status||'Active'}function render(){let q=$('search').value.toLowerCase();renderAlerts();$('list').innerHTML=records.filter(r=>r.bio.toLowerCase().includes(q)||(r.shortId||String(r.id)).toLowerCase().includes(q)).map(r=>`<div class="profile"><h3>Profile ID: ${esc(r.shortId||r.id)}</h3><div class="meta"><span class="pill">${r.pkgLabel}</span> • ${effectiveStatus(r)} • Valid till: ${r.expiry||'—'} • Next due: ${r.due||'—'} • Payments: ${(r.paymentHistory||[]).length}</div><div class="photos">${(r.photos||[]).map(p=>`<div class="photoWrap"><img src="${p}" alt="profile photo"></div>`).join('')}</div><div class="bioPreview">${esc(r.bio)}</div><div class="actions"><button class="secondary" onclick="editRec(${r.id})">Edit</button><button class="secondary" onclick="shareRec(${r.id})">Share Biodata</button><button onclick="markPosted(${r.id})">POSTED ✓</button><button class="secondary" onclick="fixed(${r.id})">Rishta Fixed</button><button class="secondary" onclick="viewPayments(${r.id})">Payment History</button><button class="secondary" onclick="renewRec(${r.id})">Renewal</button><button class="danger" onclick="del(${r.id})">Delete</button></div></div>`).join('')||'<small>No profiles saved yet.</small>'}function renderAlerts(){let today=todayISO();let due=records.filter(r=>r.due&&r.due<=today&&!['Rishta Fixed','Posting Completed'].includes(r.status));let expired=records.filter(r=>r.expiry&&today>r.expiry&&!['Rishta Fixed','Posting Completed'].includes(r.status));let dueIds=due.slice(0,8).map(r=>esc(r.shortId||r.id)).join(', ');let expiredIds=expired.slice(0,8).map(r=>esc(r.shortId||r.id)).join(', ');$('alerts').innerHTML=`<b>Team Follow-up</b><br>Posting due / overdue: <b>${due.length}</b>${due.length?` — ${dueIds}${due.length>8?' …':''}`:''}<br>Validity expired: <b>${expired.length}</b>${expired.length?` — ${expiredIds}${expired.length>8?' …':''}`:''}`;}function clearForm(){ $('editId').value='';$('bio').value='';$('photos').value='';photoFiles=[];keptPhotos=[];$('photoPreview').innerHTML='';$('pkg').value='50';$('join').value=todayISO();$('expiry').value='';$('due').value='';$('status').value='Active';$('cancel').style.display='none';calcDates()}function todayISO(){return new Date().toISOString().slice(0,10)}
function calcDates(preserveExisting=false){let pkg=$('pkg').value,j=$('join').value;if(!j)return;let d=new Date(j+'T12:00:00'),expiry='',due='';if(pkg==='100'){let e=new Date(d);e.setDate(e.getDate()+7);expiry=e.toISOString().slice(0,10);let n=new Date(d);n.setDate(n.getDate()+1);due=n.toISOString().slice(0,10)}else if(pkg==='300'){let e=new Date(d);e.setMonth(e.getMonth()+3);expiry=e.toISOString().slice(0,10);let n=new Date(d);n.setDate(n.getDate()+2);due=n.toISOString().slice(0,10)}else if(pkg==='500'){let n=new Date(d);n.setDate(n.getDate()+3);due=n.toISOString().slice(0,10)}else{due=''}$('expiry').value=expiry;$('due').value=due}
$('pkg').addEventListener('change',calcDates);$('join').addEventListener('change',calcDates);
function fileToData(f){return new Promise((res,rej)=>{let rd=new FileReader();rd.onload=()=>res(rd.result);rd.onerror=rej;rd.readAsDataURL(f)})}function watermarkData(data){return new Promise(resolve=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas');c.width=im.naturalWidth;c.height=im.naturalHeight;let ctx=c.getContext('2d');ctx.drawImage(im,0,0);ctx.save();ctx.globalAlpha=.18;ctx.fillStyle='white';ctx.strokeStyle='rgba(0,0,0,.12)';ctx.lineWidth=Math.max(1,c.width/900);ctx.font=`bold ${Math.max(12,c.width/38)}px Arial`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.translate(c.width/2,c.height/2);ctx.rotate(-Math.PI/7);ctx.strokeText('THE NIKAH MATRIMONY',0,0);ctx.fillText('THE NIKAH MATRIMONY',0,0);ctx.restore();resolve(c.toDataURL('image/jpeg',.88))};im.onerror=()=>resolve(data);im.src=data})}async function photoWithWatermark(f){return watermarkData(await fileToData(f))}$('photos').addEventListener('change',async e=>{photoFiles=Array.from(e.target.files).slice(0,6);$('photoPreview').innerHTML='';for(let f of photoFiles){let data=await fileToData(f);let wrap=document.createElement('div');wrap.className='photoWrap';let im=document.createElement('img');im.src=data;wrap.appendChild(im);$('photoPreview').appendChild(wrap)}});function extractName(b){let m=b.match(/(?:^|\n)\s*(?:1\.?\s*)?Name\s*:\s*([^\n]+)/i);return m?m[1].trim().toLowerCase():''}function extractPhones(b){return [...new Set((b.match(/(?:\+?\d[\d\s().-]{7,}\d)/g)||[]).map(x=>x.replace(/\D/g,'' ).slice(-10)).filter(x=>x.length>=10))]}function findDup(b,editing){let nm=extractName(b),phones=extractPhones(b);return records.find(r=>r.id!==editing&&(r.bio.trim().toLowerCase()===b.trim().toLowerCase()||(nm&&extractName(r.bio)===nm)||(phones.length&&extractPhones(r.bio).some(x=>phones.includes(x)))))}$('save').onclick=async()=>{let bio=$('bio').value.trim();if(!bio)return alert('Please paste biodata first.');let editing=$('editId').value?Number($('editId').value):null;let dup=findDup(bio,editing);if(dup){let matched=extractName(bio)&&extractName(dup.bio)===extractName(bio)?'name':extractPhones(bio).some(x=>extractPhones(dup.bio).includes(x))?'mobile number':'biodata';return alert(`Already saved! A matching profile was found using ${matched}. Profile ID: ${dup.shortId||dup.id}. Please check it before saving.`)}let id=editing||Date.now();let labels={'50':'₹50 One-Time Only','100':'₹100 – Daily','300':'₹300 – Alternate Days','500':'₹500 – Every 3rd Day'};let old=records.find(x=>x.id===id);let addedPhotos=await Promise.all(photoFiles.map(photoWithWatermark));let allPhotos=(editing?keptPhotos:(old?.photos||[])).slice(0,6);if(addedPhotos.length)allPhotos=[...allPhotos,...addedPhotos].slice(0,6);let firstPhone=extractPhones(bio)[0]||'';let idPrefix=/female|bride/i.test(bio)?'TNMF':/male|groom/i.test(bio)?'TNMM':'TNM';let shortId=old?.shortId||(firstPhone?idPrefix+firstPhone.slice(-4):'TNM'+String((records.reduce((max,r)=>Math.max(max,Number((r.shortId||'').replace(/\D/g,''))||0),0))+1).padStart(4,'0'));calcDates();let paymentHistory=old?(old.paymentHistory||[]):[{amount:Number($('pkg').value),date:$('join').value||todayISO(),type:'Initial Payment',package:$('pkg').value}];let rec={id,shortId,bio,pkg:$('pkg').value,pkgLabel:labels[$('pkg').value],join:$('join').value,expiry:$('expiry').value,due:$('due').value,status:$('status').value,photos:allPhotos,paymentHistory,renewals:old?(old.renewals||[]):[]};if(old)records=records.map(x=>x.id===id?rec:x);else records.unshift(rec);try{saveStore();clearForm()}catch(err){alert('Could not save: browser storage may be full. Try fewer/smaller photos.')}};$('cancel').onclick=clearForm;window.editRec=id=>{let r=records.find(x=>x.id===id);$('editId').value=r.id;$('bio').value=r.bio;$('pkg').value=r.pkg;$('join').value=r.join||'';$('expiry').value=r.expiry||'';$('due').value=r.due||'';$('status').value=r.status;photoFiles=[];keptPhotos=(r.photos||[]).slice();$('cancel').style.display='block';renderEditPhotos();calcDates(true);scrollTo(0,0)};function renderEditPhotos(){ $('photoPreview').innerHTML=keptPhotos.map((p,i)=>`<div class="photoWrap"><img src="${p}" alt="saved photo"><button type="button" class="danger" style="position:absolute;bottom:0;left:0;margin:0;padding:3px;font-size:11px" onclick="removeEditPhoto(${i})">Remove</button></div>`).join('');}window.removeEditPhoto=i=>{keptPhotos.splice(i,1);renderEditPhotos()};window.shareRec=async id=>{let r=records.find(x=>x.id===id);try{let native=window.TNMNativePlugins,photos=(r.photos||[]).filter(x=>typeof x==='string'&&x.startsWith('data:image/'));if(native&&native.Share&&native.Filesystem&&photos.length){let uris=[];for(let i=0;i<photos.length;i++){let data=photos[i],base64=data.substring(data.indexOf(',')+1);if(!base64)continue;let ext=data.startsWith('data:image/png')?'png':'jpg';let saved=await native.Filesystem.writeFile({path:'TNM_'+r.shortId+'_'+Date.now()+'_'+(i+1)+'.'+ext,data:base64,directory:native.Directory.Cache,recursive:true});if(saved&&saved.uri)uris.push(saved.uri)}if(uris.length!==photos.length)throw new Error('All photos could not be prepared for sharing.');await native.Share.share({title:'THE NIKAH MATRIMONY • '+r.shortId,text:r.bio,files:uris,mimeType:'image/*',dialogTitle:'Share Biodata'});return}if(navigator.canShare&&navigator.share){let files=[];for(let i=0;i<photos.length;i++){let res=await fetch(photos[i]),blob=await res.blob();files.push(new File([blob],'TNM_'+r.shortId+'_'+(i+1)+'.jpg',{type:blob.type||'image/jpeg'}))}if(files.length&&navigator.canShare({files})){await navigator.share({title:'THE NIKAH MATRIMONY • '+r.shortId,text:r.bio,files});return}await navigator.share({title:'THE NIKAH MATRIMONY • '+r.shortId,text:r.bio});return}if(navigator.share){await navigator.share({title:'THE NIKAH MATRIMONY • '+r.shortId,text:r.bio})}else{await navigator.clipboard.writeText(r.bio);alert('Biodata text copied. Photos can be attached manually.')}}catch(e){if(e.name!=='AbortError')alert('Sharing could not be completed: '+e.message)}};window.markPosted=id=>{let r=records.find(x=>x.id===id);r.status=r.pkg==='50'?'Posting Completed':'Posted';let cycle={'100':1,'300':2,'500':3};if(cycle[r.pkg]&&r.due){let d=new Date(r.due+'T12:00:00');d.setDate(d.getDate()+cycle[r.pkg]);r.due=d.toISOString().slice(0,10)}saveStore()};window.fixed=id=>{let r=records.find(x=>x.id===id);r.status='Rishta Fixed';saveStore()};window.viewPayments=id=>{let r=records.find(x=>x.id===id);let items=r.paymentHistory||[];if(!items.length){alert('No payment history saved for this profile.');return}let lines=items.map((p,i)=>`${i+1}. ${p.type||'Payment'} | ₹${p.amount??'—'} | ${p.date||'Date not saved'} | Package: ${p.package||'—'}`);alert('PAYMENT HISTORY • '+(r.shortId||r.id)+'\n\n'+lines.join('\n'))};window.renewRec=id=>{let r=records.find(x=>x.id===id);let pkg=prompt('Renewal package code: 50 One-Time, 100 1 Week, 300 3 Months, 500 Until Rishta Fixed',r.pkg||'50');if(pkg===null)return;if(!['50','100','300','500'].includes(pkg)){alert('Invalid package code.');return}let amountText=prompt('Renewal payment amount (₹):',pkg);if(amountText===null)return;let amount=Number(amountText);if(!Number.isFinite(amount)||amount<=0){alert('Enter a valid payment amount.');return}let date=prompt('Payment / renewal date (YYYY-MM-DD):',todayISO());if(!date)return;let oldPackage=r.pkg;r.pkg=pkg;r.pkgLabel=({'50':'₹50 One-Time Only','100':'₹100 – Daily','300':'₹300 – Alternate Days','500':'₹500 – Every 3rd Day'})[pkg];r.join=date;let d=new Date(date+'T12:00:00');r.expiry='';r.due='';if(pkg==='100'){let e=new Date(d);e.setDate(e.getDate()+7);r.expiry=e.toISOString().slice(0,10);let n=new Date(d);n.setDate(n.getDate()+1);r.due=n.toISOString().slice(0,10)}else if(pkg==='300'){let e=new Date(d);e.setMonth(e.getMonth()+3);r.expiry=e.toISOString().slice(0,10);let n=new Date(d);n.setDate(n.getDate()+2);r.due=n.toISOString().slice(0,10)}else if(pkg==='500'){let n=new Date(d);n.setDate(n.getDate()+3);r.due=n.toISOString().slice(0,10)}r.status='Active';r.paymentHistory=r.paymentHistory||[];r.paymentHistory.push({amount,date,type:'Renewal',package:pkg});r.renewals=r.renewals||[];r.renewals.push({date,amount,fromPackage:oldPackage,toPackage:pkg});saveStore();alert('Renewal saved. Previous payment history is preserved.')};window.del=id=>{if(confirm('Delete this profile?')){records=records.filter(x=>x.id!==id);saveStore()}};$('search').oninput=render;if(!$('join').value)$('join').value=todayISO();calcDates();render();
</script><script src="firebase.bundle.js"></script><script>
(function(){
const status=document.getElementById('cloudStatus');
function say(s){status.textContent=s}
document.getElementById('cloudLogin').onclick=async()=>{try{await TNMCloud.login(document.getElementById('cloudEmail').value,document.getElementById('cloudPassword').value);say('Logged in. Please tap Sync to upload/download profiles.')}catch(e){say('Login failed: '+e.message)}};
document.getElementById('cloudLogout').onclick=async()=>{try{await TNMCloud.logout();say('Logged out.')}catch(e){say(e.message)}};
document.getElementById('cloudSync').onclick=async()=>{try{say('Downloading cloud profiles…');let remote=await TNMCloud.downloadProfiles();let merged=new Map(remote.map(r=>[String(r.shortId||r.id),r]));for(let r of records)if(!merged.has(String(r.shortId||r.id)))merged.set(String(r.shortId||r.id),r);records=[...merged.values()];say('Uploading local profiles/photos…');records=await TNMCloud.syncProfiles(records);saveStore();say('Sync completed. Profiles available: '+records.length)}catch(e){say('Sync error: '+e.message)}};
if(TNMCloud.firebaseConfigured())say('Firebase config present. Login with an admin-approved account.');else say('Firebase config blank. Setup config in firebase/firebase-config.js first.');
})();
</script></body></html>
